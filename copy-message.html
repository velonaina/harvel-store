<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Message client — Harvel Store</title>
  <style>
    :root {
      --primary: #2d7a00;
      --primary-light: #edfae3;
      --blue: #1877F2;
      --green: #25D366;
      --bg: #f4f7f4;
      --card: #fff;
      --text: #1a1a1a;
      --muted: #666;
      --border: #e0e8e0;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 28px 24px;
      max-width: 480px;
      width: 100%;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .logo svg { width: 32px; height: 32px; }
    .logo span { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
    h2 {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 6px;
    }
    .commande-info {
      background: var(--primary-light);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 18px;
      font-size: .9rem;
      color: var(--primary);
      font-weight: 600;
    }
    .message-box {
      background: #f8f8f8;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-size: .9rem;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      margin-bottom: 20px;
      min-height: 120px;
    }
    .loading {
      color: var(--muted);
      font-style: italic;
      text-align: center;
      padding: 20px 0;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 10px;
      transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn-wa {
      background: var(--green);
      color: #fff;
    }
    .btn-copy {
      background: var(--blue);
      color: #fff;
    }
    .btn-copy.copied {
      background: #28a745;
    }
    .btn-sms {
      background: #f1f1f1;
      color: var(--text);
      font-size: .9rem;
    }
    .divider {
      text-align: center;
      color: var(--muted);
      font-size: .82rem;
      margin: 4px 0 10px;
    }
    .error {
      color: #c00;
      text-align: center;
      padding: 20px 0;
      font-size: .9rem;
    }
    .statut-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: .78rem;
      font-weight: 700;
      margin-left: 8px;
      background: #fff3cd;
      color: #856404;
    }
    .statut-badge.confirme { background: #edfae3; color: #2d7a00; }
    .statut-badge.expedie  { background: #cce5ff; color: #004085; }
    .statut-badge.livre    { background: #d4edda; color: #155724; }
    .statut-badge.annule   { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="40" height="40" rx="10" fill="#2d7a00"/>
      <path d="M10 14h20M14 14V11a2 2 0 012-2h8a2 2 0 012 2v3M16 20h8M16 25h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M12 14l2 18h12l2-18" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Harvel Store</span>
  </div>

  <h2>📨 Message à envoyer au client</h2>
  <div id="info" class="commande-info" style="display:none"></div>
  <div id="message-box" class="message-box">
    <div class="loading">⏳ Chargement...</div>
  </div>

  <div id="actions" style="display:none">
    <a id="btn-wa" class="btn btn-wa" href="#" target="_blank">📲 Ouvrir WhatsApp</a>
    <div class="divider">— ou pour les clients sans WhatsApp —</div>
    <button id="btn-copy" class="btn btn-copy" onclick="copyMessage()">📋 Copier le message</button>
    <a id="btn-sms" class="btn btn-sms" href="#">💬 Envoyer par SMS</a>
  </div>

  <div id="error" class="error" style="display:none">❌ Impossible de charger les informations.</div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyr8QMDn_rG4FZE3Lu6tKTd-ozVRQLrlaZZxYmfR1q8zby8VY7BuAgIo2iM29GFWA4TkQ/exec';
const TOKEN   = 'HRV-2026-xK9mP3qL7nZ';

// Lire les paramètres de l'URL
const params  = new URLSearchParams(window.location.search);
const num     = params.get('num')    || '';
const statut  = params.get('statut') || '';
const nom     = params.get('nom')    || '';
const tkn     = params.get('token')  || '';

// Messages par statut (même format que le Apps Script)
function buildMessage(nom, num, statut, trackToken, dateLivraison) {
  const prenom   = nom.split(' ')[0];
  const dateInfo = dateLivraison ? '\n🗓️ Livraison estimée : ' + dateLivraison : '';
  const lienSuivi = trackToken
    ? '🔗 Suivez votre commande ici :\nhttps://harvel-store.com/#suivi-' + num + '-' + trackToken + '\n'
    : '';

  const messages = {
    'Confirmé':
      'Bonjour ' + prenom + ' 👋\n\n' +
      '✅ Votre commande ' + num + ' a été confirmée !\n' +
      lienSuivi + dateInfo + '\n\n' +
      'Nous vous contacterons pour organiser la livraison.\n\n' +
      'Merci de votre confiance — Harvel Store 🛍️',

    'Expédié':
      'Bonjour ' + prenom + ' 👋\n\n' +
      '🚚 Votre commande ' + num + ' est en cours de livraison !\n' +
      dateInfo + '\n\n' +
      'Notre livreur est en route. Tenez-vous prêt(e) !\n\n' +
      'Merci de votre confiance — Harvel Store 🛍️',

    'Livré':
      'Bonjour ' + prenom + ' 👋\n\n' +
      '🎉 Votre commande ' + num + ' a été livrée avec succès !\n\n' +
      'Nous espérons que vous êtes satisfait(e) de votre achat.\n' +
      '⭐ Laissez-nous votre avis ici :\nhttps://harvel-store.com/#avis-' + num + '-' + ' 😊\n\n' +
      'Merci — Harvel Store 🛍️',

    'Annulé':
      'Bonjour ' + prenom + ' 👋\n\n' +
      '❌ Votre commande ' + num + ' a malheureusement été annulée.\n\n' +
      'Contactez-nous pour plus d\'informations.\n\n' +
      'Nous nous excusons pour la gêne — Harvel Store 🛍️',
  };

  return messages[statut] || 'Bonjour ' + prenom + ' 👋\n\nVotre commande ' + num + ' a été mise à jour : ' + statut + '.\n\nMerci — Harvel Store 🛍️';
}

var messageTexte = '';
var phoneNorm    = '';

async function init() {
  if (!num || !statut || !nom) {
    document.getElementById('message-box').innerHTML = '<div class="error">Paramètres manquants.</div>';
    return;
  }

  try {
    // Appel API pour récupérer phone + token + date_livraison
    const url = API_URL + '?token=' + TOKEN + '&action=suivi&commande=' + encodeURIComponent(num) + '&track_token=' + encodeURIComponent(tkn);
    const res  = await fetch(url, { redirect: 'follow' });
    const data = JSON.parse(await res.text());

    let trackToken   = '';
    let dateLivraison = '';
    let phone        = '';

    if (data.success && data.commande) {
      trackToken    = tkn || '';
      dateLivraison = data.commande.date_livraison || '';
      phone         = data.commande.phone || '';
    }

    // Construire le message
    messageTexte = buildMessage(nom, num, statut, tkn, dateLivraison);

    // Normaliser le téléphone
    phoneNorm = phone.replace(/\s/g,'').replace(/^\+/,'').replace(/^0/,'261');
    if (!phoneNorm.startsWith('261')) phoneNorm = '261' + phoneNorm;

    const waUrl  = 'https://wa.me/' + phoneNorm + '?text=' + encodeURIComponent(messageTexte);
    const smsUrl = 'sms:' + phone + '?body=' + encodeURIComponent(messageTexte);

    // Afficher
    const statutClass = {
      'Confirmé': 'confirme', 'Expédié': 'expedie',
      'Livré': 'livre', 'Annulé': 'annule'
    }[statut] || '';

    document.getElementById('info').style.display = 'block';
    document.getElementById('info').innerHTML =
      '📦 ' + num + ' — ' + nom +
      '<span class="statut-badge ' + statutClass + '">' + statut + '</span>';

    document.getElementById('message-box').textContent = messageTexte;
    document.getElementById('btn-wa').href  = waUrl;
    document.getElementById('btn-sms').href = smsUrl;
    document.getElementById('actions').style.display = 'block';

  } catch(e) {
    document.getElementById('message-box').innerHTML = '';
    // Afficher quand même avec les infos de base
    messageTexte = buildMessage(nom, num, statut, tkn, '');
    document.getElementById('message-box').textContent = messageTexte;
    document.getElementById('info').style.display = 'block';
    document.getElementById('info').innerHTML = '📦 ' + num + ' — ' + nom;
    document.getElementById('btn-wa').href = '#';
    document.getElementById('btn-sms').href = '#';
    document.getElementById('actions').style.display = 'block';
  }
}

function copyMessage() {
  if (!messageTexte) return;
  navigator.clipboard.writeText(messageTexte).then(function() {
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✅ Message copié !';
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = '📋 Copier le message';
      btn.classList.remove('copied');
    }, 2500);
  }).catch(function() {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = messageTexte;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✅ Message copié !';
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = '📋 Copier le message';
      btn.classList.remove('copied');
    }, 2500);
  });
}

init();
</script>
</body>
</html>
