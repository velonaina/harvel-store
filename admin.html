<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Harvel Store</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo h1 {
      font-size: 1.6rem;
      color: #1F3864;
      font-weight: 700;
    }
    .logo p {
      color: #888;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      transition: border 0.2s;
      outline: none;
    }
    input:focus { border-color: #2E75B6; }
    button {
      width: 100%;
      padding: 12px;
      background: #1F3864;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2E75B6; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .error {
      background: #FFF3F3;
      color: #c0392b;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Harvel Store</h1>
      <p>Espace Administration</p>
    </div>
    <div class="error" id="error"></div>
    <label>Email</label>
    <input type="email" id="email" placeholder="votre@email.com" />
    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="••••••••" />
    <button id="btn" onclick="handleLogin()">Se connecter</button>
  </div>

<script type="module">
  import { login } from './admin.js'
  import { supabase } from './supabase-client.js'

  // Si déjà connecté → rediriger direct vers dashboard
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = '/admin-dashboard.html'
  })

  window.handleLogin = async function() {
    const email = document.getElementById('email').value
    const password = document.getElementById('password').value
    const btn = document.getElementById('btn')
    const errorEl = document.getElementById('error')

    errorEl.style.display = 'none'
    btn.disabled = true
    btn.textContent = 'Connexion...'

    const result = await login(email, password)

    if (result.success) {
      window.location.href = '/admin-dashboard.html'
    } else {
      errorEl.textContent = 'Email ou mot de passe incorrect.'
      errorEl.style.display = 'block'
      btn.disabled = false
      btn.textContent = 'Se connecter'
    }
  }

  // Login avec touche Entrée
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.handleLogin()
  })
</script>
