<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page introuvable — Harvel Store</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',sans-serif;background:#f5fcf0;color:#1a2e10;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .container{text-align:center;max-width:500px;}
  .icon{font-size:5rem;margin-bottom:20px;}
  h1{font-size:1.5rem;font-weight:800;color:#3dbd00;margin-bottom:10px;}
  p{color:#6b8f5a;font-size:.95rem;line-height:1.7;margin-bottom:24px;}
  .btn{background:#3dbd00;color:#fff;border:none;padding:12px 30px;border-radius:9px;font-size:.95rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s;}
  .btn:hover{background:#2e9100;}
  .logo{font-size:1.3rem;font-weight:800;color:#3dbd00;font-family:Georgia,serif;margin-bottom:30px;display:block;}
</style>
</head>
<body>
<div class="container">
  <span class="logo">🛍️ Harvel Store</span>
  <div class="icon">😕</div>
  <h1>Page introuvable !</h1>
  <p>La page que vous cherchez n'existe pas ou a été déplacée.<br/>Retournez à la boutique pour continuer vos achats.</p>
  <a href="/harvel-store/" class="btn">🏠 Retour à la boutique</a>
</div>
</body>
</html>
